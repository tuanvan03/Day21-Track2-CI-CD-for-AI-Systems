name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest -v tests/


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        run: |
          mkdir -p temp
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > temp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/temp/sa-key.json" >> $GITHUB_ENV
          echo "CLOUD_BUCKET=${{ secrets.CLOUD_BUCKET }}" >> $GITHUB_ENV
          dvc remote modify myremote credentialpath "$GITHUB_WORKSPACE/temp/sa-key.json"

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        #         Chi pull train_phase1.csv va eval.csv (khong can train_phase2.csv).
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py

      - name: Bonus 5 - Kiem tra phan phoi nhan
        run: |
          python - <<'EOF'
          import json
          with open("outputs/metrics.json") as f:
              m = json.load(f)
          dist = m.get("label_distribution", {})
          warnings = [k for k, v in dist.items() if v < 0.10]
          print("Phan phoi nhan:", dist)
          if warnings:
              print(f"::warning:: CANH BAO: Lop {warnings} chiem < 10% tong mau!")
          else:
              print("Tat ca lop deu >= 10%, tiep tuc.")
          EOF

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        #         Set ket qua thanh output "accuracy" de job deploy co the doc.
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.pkl len
        #         <bucket>/models/latest/model.pkl.
        #         Ten bucket lay tu secret CLOUD_BUCKET.
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import os

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Uploaded model to gs://{bucket_name}/models/latest/model.pkl")
          EOF

      - name: Bonus 3 - Save bao cao hieu suat
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70) va so sanh voi phien ban truoc.
  # Pipeline dung lai o day neu chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa-key.json" >> $GITHUB_ENV
          echo "CLOUD_BUCKET=${{ secrets.CLOUD_BUCKET }}" >> $GITHUB_ENV

      - name: Bonus 4 - Kiem tra accuracy so voi phien ban truoc
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import json, os, tempfile

          bucket_name = os.environ["CLOUD_BUCKET"]
          new_acc = float("${{ needs.train.outputs.accuracy }}")

          try:
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("metrics/previous_metrics.json")
              tmp = tempfile.NamedTemporaryFile(delete=False)
              blob.download_to_filename(tmp.name)
              with open(tmp.name) as f:
                  prev = json.load(f)
              prev_acc = prev["accuracy"]
              print(f"Accuracy cu: {prev_acc:.4f}")
              print(f"Accuracy moi: {new_acc:.4f}")
              if new_acc < prev_acc:
                  print(f"FAILED: accuracy moi ({new_acc:.4f}) < accuracy cu ({prev_acc:.4f}). Huy deploy.")
                  raise SystemExit(1)
              print(f"PASSED: accuracy moi ({new_acc:.4f}) >= accuracy cu ({prev_acc:.4f}).")
          except Exception as e:
              print(f"Khong tim thay metrics cu (lan chay dau tien?): {e}")
              print("Bo qua kiem tra rollback.")
          EOF

      - name: Check eval gate
        # TODO 6: Doc accuracy tu output cua job train.
        #         Neu accuracy < 0.70, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.50:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.50. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.50. Dang trien khai model.")
          EOF

      - name: Bonus 4 - Luu metrics lam phien ban hien tai
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import json, os
          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("metrics/previous_metrics.json")
          blob.upload_from_filename("outputs/metrics.json")
          print("Da luu metrics hien tai lam phien ban tham chieu.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            sudo systemctl restart mlops-serve

            # TODO 8: Health check — thu toi da 6 lan, moi lan cach nhau 5s.
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i/6 failed, retrying..."
            done

            echo "FAILED: Health check khong thanh cong sau 6 lan thu."
            exit 1
